<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOVA ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1c;--cy:#52e0ff;--pk:#ff5c9a;--au:#ffd76a;--tx:#eef3ff;--dm:#8f9bc4;--pn:rgba(14,20,48,.82);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#03050f;color:var(--tx);font:600 15px Rajdhani,'Segoe UI',system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#st{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh*.6));overflow:clip;
 background:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/16px 16px,
 linear-gradient(115deg,transparent 40%,rgba(82,224,255,.10) 50%,transparent 60%),
 radial-gradient(120% 60% at 50% 0,#27306e,transparent 70%),linear-gradient(#0c1233,#070b1c)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:97;width:100%;height:100%}
.sc{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(64px + var(--sat)) 14px calc(80px + var(--sab));overflow:hidden}
.sc.on{display:flex}
.scr{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:8px}.scr::-webkit-scrollbar{display:none}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 12px 8px;background:linear-gradient(#050818ee,transparent)}
.cut{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.rank{background:linear-gradient(90deg,var(--pk),#ff8fb8);color:#35081c;font-weight:700;padding:6px 18px;font-size:14px;letter-spacing:1px}
.cur{margin-left:auto;display:flex;gap:6px}
.cur b{display:flex;align-items:center;gap:6px;padding:5px 16px;background:#0a1030;border-bottom:2px solid var(--au);font-size:15px;letter-spacing:.5px}
.cur b:last-child{border-color:var(--cy)}
.cur i{width:10px;height:10px;transform:rotate(45deg);background:var(--au)}.cur b:last-child i{background:var(--cy)}
/* NAV */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:50;height:calc(70px + var(--sab));padding:0 8px var(--sab);display:flex;background:linear-gradient(0deg,#050818,#050818f2);border-top:2px solid #2a3470}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dm);font-size:12px;letter-spacing:1px;position:relative;transition:.2s}
#nav svg{width:24px;height:24px;fill:currentColor}
#nav .on{color:var(--cy)}#nav .on::before{content:'';position:absolute;top:-2px;left:18%;right:18%;height:3px;background:var(--cy);box-shadow:0 0 14px var(--cy)}
#nav .on svg{filter:drop-shadow(0 0 6px var(--cy))}
/* BUTTONS */
.btn{position:relative;padding:12px 26px;font-weight:700;font-size:17px;letter-spacing:1.5px;color:#241100;background:linear-gradient(#fff0b0,var(--au));clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:.1s;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#fff9 50%,transparent 60%);transform:translateX(-120%);animation:sh 3s infinite}
.btn:active{transform:scale(.96);filter:brightness(.9)}
.btn.cy{background:linear-gradient(#bff4ff,var(--cy));color:#00222c}.btn.pk{background:linear-gradient(#ffc0d8,var(--pk));color:#3a0420}.btn.gh{background:#2a3470;color:var(--tx)}.btn.gh::after{display:none}
.btn:disabled{filter:grayscale(1) brightness(.6)}
@keyframes sh{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ttl{font-size:26px;font-weight:700;letter-spacing:3px;font-style:italic;margin:2px 0 10px;display:flex;align-items:center;gap:10px}
.ttl::before{content:'';width:6px;height:26px;background:var(--pk);transform:skewX(-15deg)}
.ttl small{margin-left:auto;font-size:13px;color:var(--dm);font-style:normal;letter-spacing:1px}
.dm{color:var(--dm)}
/* ELEMENT BADGE */
.eb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:13px;font-weight:700;color:#0a0a1a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
/* HOME */
#home .stage{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0}
#home .kj{position:absolute;top:2%;left:50%;transform:translateX(-50%);font-size:230px;font-weight:700;line-height:1;opacity:.1;pointer-events:none}
#home .ring{position:absolute;width:78%;aspect-ratio:1;bottom:6%;border-radius:50%;border:2px dashed;opacity:.5;animation:rot 40s linear infinite}
#home .ring.b{width:62%;bottom:12%;animation-direction:reverse;border-style:solid;opacity:.3}
@keyframes rot{to{transform:rotate(360deg)}}
#lead{position:relative;height:96%;animation:fl 4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 12px 24px #0008)}
@keyframes fl{50%{transform:translateY(-8px)}}
#lead svg{height:100%;width:auto}
.plate{position:absolute;left:0;bottom:30px;padding:8px 26px 8px 14px;background:linear-gradient(90deg,#0a1030f0,#0a103000);border-left:5px solid var(--pk)}
.plate b{display:block;font-size:30px;font-style:italic;letter-spacing:2px;line-height:1}.plate span{font-size:13px;color:var(--dm);letter-spacing:1px}
.say{position:absolute;right:0;top:12%;max-width:46%;padding:10px 14px;background:#fffffff2;color:#161a3a;font-size:14px;clip-path:polygon(0 0,100% 0,100% 82%,12px 82%,0 100%);padding-bottom:18px;opacity:0;transition:.25s}
.say.on{opacity:1}
.strip{display:flex;gap:6px;margin:10px 0}
.slot{flex:1;aspect-ratio:3/4;position:relative;background:#0c1236;border:2px solid #2a3470;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.slot svg{width:100%;height:100%;object-fit:cover}.slot em{position:absolute;bottom:2px;left:4px;font-size:11px;font-style:normal;font-weight:700;text-shadow:0 1px 3px #000}
.go{display:flex;gap:10px;align-items:center}
.go .btn{flex:1;font-size:24px;padding:16px}
.go .inf{width:30%;font-size:12px;line-height:1.3}.go .inf b{display:block;font-size:18px;color:var(--au)}
/* HEROES */
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hc{position:relative;aspect-ratio:3/4.2;background:radial-gradient(circle at 50% 30%,var(--c) -80%,#0c1236 75%);border:2px solid var(--r);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);overflow:hidden;transition:.1s}
.hc:active{transform:scale(.96)}
.hc svg{position:absolute;left:0;top:6%;width:100%;height:80%}
.hc .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;background:linear-gradient(transparent,#000d);font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.hc .eb{position:absolute;top:5px;left:5px}.hc .rr{position:absolute;top:4px;right:6px;font-weight:700;font-style:italic;color:var(--r);font-size:15px;text-shadow:0 0 8px var(--r)}
.hc.SSR::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff55 50%,transparent 60%);animation:sh 3s infinite}
.hc.in{outline:2px solid var(--cy);outline-offset:-5px}
.hc.lk{filter:grayscale(1) brightness(.4)}
/* SHEET */
.ov{position:absolute;inset:0;z-index:70;background:#02040ccc;display:flex;align-items:flex-end;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.sh{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(#141c4a,#0a0f2c);border-top:3px solid var(--cy);padding:16px 16px calc(18px + var(--sab));animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
@keyframes up{from{transform:translateY(100%)}}
.hd{display:flex;gap:12px}.hd .pt{width:42%;flex:none;aspect-ratio:3/4;background:radial-gradient(circle at 50% 30%,var(--c) -60%,#0c1236 70%);border:2px solid var(--r);clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.hd .pt svg{width:100%;height:100%}
.hd h2{font-size:30px;font-style:italic;letter-spacing:2px;line-height:1}
.bar{display:flex;justify-content:space-between;padding:4px 8px;background:#ffffff0d;margin-top:4px;font-size:14px}.bar b{color:var(--au)}
.sk{margin-top:8px;padding:8px 10px;background:#ffffff0a;border-left:3px solid var(--cy);font-size:13px;line-height:1.3}.sk b{color:var(--cy);font-size:15px}.sk.ul{border-color:var(--pk)}.sk.ul b{color:var(--pk)}
.row{display:flex;gap:8px;margin-top:12px}.row .btn{flex:1;padding:12px 8px}
/* STAGE */
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px;background:#141c4a;color:var(--dm);font-weight:700;letter-spacing:1px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}.tabs .on{background:var(--c);color:#111}
.stg{display:flex;align-items:center;gap:12px;padding:12px 18px;margin-bottom:8px;background:linear-gradient(90deg,#1a2360,#0d1338);border-left:5px solid var(--c);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);width:100%;text-align:left}
.stg .n{font-size:26px;font-style:italic;font-weight:700;width:52px;color:var(--c)}.stg .t{flex:1;font-size:17px}.stg .t small{display:block;color:var(--dm);font-size:12px}
.stg.lk{opacity:.4;filter:grayscale(1)}.stars{color:#3a4170;letter-spacing:2px;font-size:18px}.stars .f{color:var(--au);text-shadow:0 0 8px var(--au)}
/* GACHA */
.ban{position:relative;flex:1;min-height:0;margin-bottom:12px;overflow:hidden;background:linear-gradient(135deg,#3a1a6e,#12206a 60%,#0a5a7a);border:2px solid var(--au);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
.ban svg{position:absolute;right:-4%;bottom:0;height:104%}
.ban .tx{position:absolute;left:16px;top:16px;max-width:55%}.ban .tx b{font-size:34px;font-style:italic;line-height:1;display:block;color:var(--au);text-shadow:0 0 16px #ffd76a88}
.ban .pt{position:absolute;left:16px;bottom:14px;background:#000a;padding:4px 14px;font-size:14px}
.pulls{display:flex;gap:10px}.pulls .btn{flex:1;font-size:15px;line-height:1.1;padding:10px}.pulls small{display:block;font-size:12px;font-weight:600;opacity:.8}
/* REVEAL */
#rv{position:absolute;inset:0;z-index:85;background:radial-gradient(circle,#1a1f55,#03050f);display:none;flex-direction:column;align-items:center;justify-content:center}
#rv.on{display:flex}
#rv .ray{position:absolute;width:160%;aspect-ratio:1;background:repeating-conic-gradient(from 0deg,var(--c) 0 6deg,transparent 6deg 18deg);opacity:.18;animation:rot 14s linear infinite;-webkit-mask:radial-gradient(circle,#000,transparent 65%);mask:radial-gradient(circle,#000,transparent 65%)}
.rc{position:relative;width:62%;aspect-ratio:3/4.4;background:radial-gradient(circle at 50% 35%,var(--c) -50%,#0c1236 75%);border:3px solid var(--r);box-shadow:0 0 50px var(--r);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.rc svg{position:absolute;inset:4% 0 18%;width:100%;height:78%}.rc .nm{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000e)}
.rc .nm b{font-size:30px;font-style:italic;display:block;line-height:1}.rc .rr{position:absolute;top:8px;left:12px;font-size:34px;font-style:italic;font-weight:700;color:var(--r);text-shadow:0 0 12px var(--r)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:92%}.mini .hc{aspect-ratio:3/4.4}.mini .nm{font-size:10px}.mini .rr{font-size:11px}
/* BATTLE */
#bt{position:absolute;inset:0;z-index:60;display:none;overflow:hidden;flex-direction:column;background:radial-gradient(90% 50% at 50% 45%,var(--bc),transparent),linear-gradient(#0a0f2c,#05071a)}
#bt.on{display:flex}
#bt .top{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 10px 6px;background:linear-gradient(#000a,transparent);z-index:3}
#bt .top .rd{font-size:20px;font-style:italic;font-weight:700;letter-spacing:2px;margin-right:auto}
.sp{width:44px;padding:5px 0;background:#1a2360;text-align:center;font-weight:700;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}.sp.on{background:var(--cy);color:#00222c}
.fld{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;padding:0 6px;position:relative;perspective:700px}
.fld::before{content:'';position:absolute;left:-10%;right:-10%;top:50%;height:3px;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:rotate(-2deg)}
.rw{display:flex;justify-content:center;gap:4px;align-items:flex-end}
.u{position:relative;width:19%;transition:opacity .4s,filter .4s}.u .a{aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}.u svg{height:118%;width:auto;max-width:100%;filter:drop-shadow(0 6px 8px #0009)}
.u.e svg{height:100%}.u.e.bs{width:30%}
.u .b{height:6px;background:#000a;margin-top:2px;transform:skewX(-20deg);overflow:hidden}.u .b i{display:block;height:100%;transition:width .3s}
.u .h i{background:linear-gradient(90deg,#3dff9a,#b6ff5a)}.u.e .h i{background:linear-gradient(90deg,#ff3d6e,#ff8a5a)}.u .n i{background:var(--cy)}.u .b.n{height:3px}
.u .eb{position:absolute;top:0;left:0;width:18px;height:18px;font-size:10px}
.u.dead{opacity:0;filter:grayscale(1) blur(3px);pointer-events:none}
.u.act::after{content:'';position:absolute;left:10%;right:10%;bottom:14px;height:8px;border-radius:50%;background:var(--au);box-shadow:0 0 16px var(--au);opacity:.8}
.pp{position:absolute;left:50%;top:10%;font-size:24px;font-weight:700;font-style:italic;pointer-events:none;text-shadow:0 2px 0 #000,0 0 10px #000;animation:pu .9s forwards;z-index:9}
@keyframes pu{from{transform:translate(-50%,0) scale(.5)}20%{transform:translate(-50%,-14px) scale(1.3)}to{transform:translate(-50%,-60px) scale(1);opacity:0}}
.ub{flex:none;display:flex;gap:6px;position:relative;z-index:4;padding:8px 8px calc(10px + var(--sab));background:linear-gradient(transparent,#000c)}
.ult{flex:1 1 0;min-width:0;max-width:20%;aspect-ratio:1;position:relative;border-radius:50%;background:conic-gradient(var(--cy) calc(var(--p)*1%),#1a2360 0);padding:3px;transition:.2s}
.ult>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0c1236;position:relative}.ult svg{width:130%;margin:-8% -15%}
.ult.dead{filter:grayscale(1) brightness(.4)}
.ult.rdy{background:conic-gradient(var(--au),var(--pk),var(--au));animation:pl .7s infinite alternate}
.ult.rdy::after{content:'ULT';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--pk);color:#fff;font-size:11px;font-weight:700;padding:0 8px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.ult.qd{background:var(--au)}.ult.qd::after{content:'SIAP';background:var(--au);color:#000}
@keyframes pl{to{box-shadow:0 0 22px 4px var(--pk)}}
#cut{position:absolute;left:0;right:0;top:34%;height:30%;z-index:75;display:none;overflow:hidden;background:linear-gradient(100deg,transparent 0,var(--c) 40%,transparent 100%);clip-path:polygon(0 12%,100% 0,100% 88%,0 100%)}
#cut svg{position:absolute;left:4%;bottom:-18%;height:150%}
#cut b{position:absolute;right:6%;top:30%;font-size:32px;font-style:italic;color:#fff;text-shadow:0 3px 0 #0008;letter-spacing:2px;text-align:right}
#cut small{display:block;font-size:14px;letter-spacing:3px}
#cut.on{display:block;animation:cu 1s forwards}
@keyframes cu{0%{transform:translateX(-100%)}18%{transform:none}85%{transform:none;opacity:1}100%{transform:translateX(30%);opacity:0}}
.res{width:86%;text-align:center;padding:20px;background:linear-gradient(#141c4a,#0a0f2c);border-top:4px solid var(--c);animation:pop .4s}
.res h1{font-size:46px;font-style:italic;letter-spacing:4px;color:var(--c);text-shadow:0 0 20px var(--c);line-height:1}
.res .stars{font-size:40px;margin:6px 0}.res p{font-size:18px;margin:2px 0}
#tt{position:absolute;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);z-index:95;background:#fffffff0;color:#101435;padding:8px 22px;font-weight:700;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}#tt.on{opacity:1}
#wp{position:absolute;inset:0 -30%;z-index:99;background:linear-gradient(100deg,var(--pk) 0,var(--cy) 100%);transform:translateX(-130%) skewX(-14deg);pointer-events:none}
.shake{animation:sk .35s}@keyframes sk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.tg{position:absolute;left:0;right:0;top:24px;z-index:2;text-align:center;background:#ff5c9aee;color:#fff;font-size:11px;font-weight:700;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqs{display:flex;gap:6px;margin-top:10px}
.es{flex:1;aspect-ratio:1;position:relative;background:#0c1236;border:2px solid var(--r);display:flex;align-items:center;justify-content:center;font-size:22px;color:#3a4170;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.es svg{width:80%}.es em{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:#fff;text-shadow:0 1px 3px #000}
.ic .nm{font-size:11px}.ban .iban{position:absolute;right:8px;top:14%;bottom:14%;width:52%;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.ban .iban svg{position:static;height:auto;width:100%;animation:fl 3s ease-in-out infinite}
.rg{position:absolute;width:40px;height:40px;border-radius:50%;border:4px solid var(--c);animation:rg 1.2s ease-out forwards}
@keyframes rg{to{transform:scale(14);opacity:0}}
.orb{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 30px 14px var(--c),0 0 90px 40px var(--c);animation:ob var(--d) cubic-bezier(.5,0,.9,.4) forwards}
@keyframes ob{0%{transform:scale(.2);opacity:.2}60%{transform:scale(1.2);opacity:1}100%{transform:scale(2.4)}}
.trem{animation:tm .1s infinite}@keyframes tm{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.flash{position:absolute;inset:0;background:var(--c);animation:fl2 .7s forwards;pointer-events:none;z-index:5}@keyframes fl2{from{opacity:1}to{opacity:0}}
.ray.SSR{opacity:.45;animation-duration:6s}.ray.SR{opacity:.3;animation-duration:9s}
.rc.SR{box-shadow:0 0 60px var(--r)}.rc.SSR{box-shadow:0 0 70px var(--r),0 0 140px #ff9d0a88}
.rc.SSR::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#fff8 50%,transparent 60%);animation:sh 1.6s infinite}
.big{position:absolute;top:7%;font-size:96px;font-weight:700;font-style:italic;letter-spacing:6px;background:linear-gradient(#fff,#ffd76a 50%,#ff9d0a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ffb300);animation:bg .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bg{from{transform:scale(3);opacity:0}}
.skp{position:absolute;top:calc(14px + var(--sat));right:14px;padding:6px 16px;background:#2a3470;z-index:6;font-weight:700;letter-spacing:1px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.lvf{position:absolute;z-index:98;pointer-events:none;width:0;height:0}
.lvf i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border:3px solid var(--c);border-radius:50%;animation:rg 1s forwards}.lvf i+i{animation-delay:.2s}
.lvf b{position:absolute;left:0;transform:translate(-50%,0);white-space:nowrap;font-size:30px;font-style:italic;color:var(--c);text-shadow:0 0 12px var(--c),0 2px 0 #000;animation:pu2 1.3s forwards}
@keyframes pu2{from{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,-10px) scale(1.2);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
#cut svg.ci{left:0;bottom:0;height:100%;width:100%}#cut b.cb{left:4%;right:auto;top:auto;bottom:10%;text-align:left}.ult svg.ic{width:100%;height:100%;margin:0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>

  rv.innerHTML=`<div class="flash" style="--c:${x.r=='R'?c:'#fff'}"></div>${n>1?'<button class="skp" id="skp">LEWATI ▶▶</button>':''}<div class="ray ${x.r}" style="--c:${c}"></div>${x.r!='R'?`<div class="rg" style="--c:${c}"></div><div class="rg" style="--c:${c};animation-delay:.25s"></div>`:''}${x.r=='SSR'?'<div class="big">SSR</div>':''}<div class="rc ${x.r}" style="--r:${c};--c:${ec}"><span class="rr">${x.r}</span>${i?itemArt(x):art(x)}<div class="nm"><b>${nm}</b>${i?itxt({...x,lv:1}):eb(x.e)+' '+x.t}</div></div><p style="margin-top:22px;font-size:18px;color:${x.dup?'var(--dm)':'var(--au)'}">${x.dup?'Duplikat · +'+x.dup+' Koin':'BARU!'}</p><p class="dm" style="margin-top:8px">Ketuk untuk lanjut</p>`;
  const r=rv.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.42,c,{R:20,SR:50,SSR:110}[x.r],{R:4,SR:7,SSR:11}[x.r]);
  const rain=x.r=='SSR'?setInterval(()=>{for(let k=0;k<3;k++)P.push({x:R(0,cv.width),y:-4,vx:R(-.4,.4),vy:R(1.5,3.5),l:3,c:pick(['#ffd76a','#fff3b3','#ffb347']),z:R(2,5)})},50):0;
  await new Promise(res_=>{rv.onclick=res_;const b=rv.querySelector('#skp');if(b)b.onclick=e=>{e.stopPropagation();skip=true;res_()}});clearInterval(rain)}
 if(n>1){rv.innerHTML=`<div class="mini">${res.map(x=>x.kind=='i'?icard(x):card(x,null)).join('')}</div><button class="btn" id="ok" style="margin-top:24px">OKE</button>`;await new Promise(r=>rv.querySelector('#ok').onclick=r)}
 rv.classList.remove('on');rv.onclick=null;rv.innerHTML='';HUD();R_.gacha()}
function ownerOf(u,ex){return Object.keys(S.lo).find(h=>h!=ex&&(S.lo[h]||[]).includes(u))}
/* ===== EDIT TIM ===== */
const refTeam=()=>{if(cur=='home')R_.home();document.querySelectorAll('.strip').forEach(e=>e.outerHTML=strip())};
function teamPick(i){const cu=S.team[i],L=[...S.heroes].sort((a,b)=>RT[HB[b.id].r].m-RT[HB[a.id].r].m||power(b)-power(a));
 const o=sheet(`<div class="ttl">SLOT ${i+1}<small>${cu?HB[cu].n:'Kosong'}</small></div><div class="dm">Pilih hero untuk slot ini</div>${cu&&S.team.length>1?'<div class="row"><button class="btn gh" id="kl">KOSONGKAN SLOT</button></div>':''}<div class="hg" style="margin-top:12px">${L.map(x=>card(HB[x.id],x,S.team.includes(x.id)?'in':'')).join('')}</div>`);
 o.querySelectorAll('.hc').forEach(b=>b.onclick=()=>{const id=b.dataset.id,j=S.team.indexOf(id);
  if(j!=i){if(i<S.team.length){if(j>=0)S.team[j]=S.team[i];S.team[i]=id}else{if(j>=0)S.team.splice(j,1);S.team.push(id)}}
  snd('tap');o.remove();refTeam();HUD()});
 const k=o.querySelector('#kl');if(k)k.onclick=()=>{S.team.splice(i,1);snd('tap');o.remove();refTeam();HUD()}}
/* ===== BATTLE ===== */
let B=null;
const pre=g=>{if(g>S.cl+1)return toast('Selesaikan misi sebelumnya dulu');const c=CH[Math.floor((g-1)/5)],boss=(g-1)%5==4,k=1+.22*(g-1);
 const el=sheet(`<div class="ttl">${c.n} ${Math.floor((g-1)/5)+1}-${(g-1)%5+1}${boss?'<small style="color:var(--pk)">BOSS</small>':''}</div><div class="dm">Elemen musuh: ${[...new Set(boss?[c.be,...c.e]:c.e)].map(e=>eb(e)+' ').join('')}<br>Keunggulan: Api>Angin>Petir>Air>Api · Cahaya↔Gelap</div><div class="dm" style="margin-top:8px">Ketuk slot untuk mengganti hero tim</div>${strip()}<div class="row"><button class="btn gh" id="au_">TIM OTOMATIS</button><button class="btn" id="st_">MULAI</button></div>`);
 el.querySelector('#au_').onclick=()=>{S.team=[...S.heroes].sort((a,b)=>power(b)-power(a)).slice(0,5).map(o=>o.id);snd('tap');refTeam();HUD()};el.querySelector('#st_').onclick=()=>{el.remove();fight(g)}};
function unit(side,i,o){return{side,i,...o,mh:o.hp,en:0,cd:0,au:0,alive:true,q:false}}
async function fight(g){snd('tap');const c=CH[Math.floor((g-1)/5)],boss=(g-1)%5==4,k=1+.22*(g-1),n=enN(g);
 const U=[];S.team.forEach((id,i)=>{const h=HB[id],s=stats(id,owned(id).lv);U.push(unit('p',i,{h,id,e:h.e,...s}))});
 for(let i=0;i<n;i++){const isB=boss&&i==Math.floor(n/2),e=isB?c.be:c.e[i%3],b=isB?[2600,170,105,100]:[650,85,50,90+i*8];
  U.push(unit('e',i,{e,boss:isB,n:isB?c.b:MN[e],hp:Math.round(b[0]*k),atk:Math.round(b[1]*(1+.14*(g-1))),def:Math.round(b[2]*(1+.1*(g-1))),spd:b[3]}))}
 B={g,sp:1,U,round:1,on:true};
 const bt=$('#bt');bt.style.setProperty('--bc',c.c+'33');bt.classList.add('on');
 const rowH=side=>`<div class="rw">${U.filter(u=>u.side==side).map(u=>`<div class="u ${side=='e'?'e':''} ${u.boss?'bs':''}" id="${side}${u.i}">${eb(u.e)}<div class="a">${side=='p'?art(u.h):mon(u.e,u.boss)}</div><div class="b h"><i style="width:100%"></i></div>${side=='p'?'<div class="b n"><i style="width:0"></i></div>':''}</div>`).join('')}</div>`;
 bt.innerHTML=`<div class="top"><span class="rd">ROUND <span id="rd">1</span></span>${[1,2,3].map(x=>`<button class="sp ${x==1?'on':''}" data-sp="${x}">×${x}</button>`).join('')}<button class="sp" id="sr">✕</button></div><div class="fld">${rowH('e')}${rowH('p')}</div><div class="ub">${U.filter(u=>u.side=='p').map(u=>`<button class="ult" id="ul${u.i}" data-u="${u.i}" style="--p:0"><div>${art(u.h,'i')}</div></button>`).join('')}</div><div id="cut"></div>`;
 U.forEach(u=>u.el=$('#'+u.side+u.i));
 await sleep(500);
 let first=true;
 while(B&&B.on){const order=U.filter(u=>u.alive).sort((a,b)=>b.spd-a.spd);
  for(const u of order){if(!B||!B.on)return;if(!u.alive)continue;await turn(u);if(!B||!B.on)return;if(end(g))return}
  B.round++;$('#rd')&&($('#rd').textContent=B.round);if(B.round>30)return finish(g,false,'Waktu habis!')}}
const al=(s)=>B.U.filter(u=>u.side==s&&u.alive);
function upd(u){u.el.querySelector('.h i').style.width=u.hp/u.mh*100+'%';const nb=u.el.querySelector('.n i');if(nb)nb.style.width=u.en+'%';
 if(u.side=='p'){const b=$('#ul'+u.i);if(b){b.style.setProperty('--p',u.en);b.classList.toggle('rdy',u.alive&&u.en>=100&&!u.q);b.classList.toggle('qd',u.alive&&u.q);b.classList.toggle('dead',!u.alive)}}
 u.el.classList.toggle('dead',!u.alive)}
function pop(u,txt,col,big){const p=document.createElement('div');p.className='pp';p.textContent=txt;p.style.color=col;if(big)p.style.fontSize='34px';u.el.appendChild(p);setTimeout(()=>p.remove(),900)}
function hitU(a,t,m){const ev=EM(a.e,t.e),cr=Math.random()<.15;let d=Math.max(1,Math.round(a.atk*(a.au>0?1.3:1)*m*100/(100+t.def*.8)*ev*R(.92,1.08)*(cr?1.5:1)));
 t.hp=Math.max(0,t.hp-d);if(t.side=='p')t.en=Math.min(100,t.en+12);if(!t.hp){t.alive=false;t.q=false}
 pop(t,(cr?'CRIT ':'')+d,ev>1?'#ffd76a':ev<1?'#9aa7c7':'#fff',cr);snd('hit');
 t.el.animate([{filter:'brightness(4)',transform:'translateX(-6px)'},{filter:'none',transform:'translateX(6px)'},{transform:'none'}],{duration:260/B.sp});
 const r=t.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,EL[a.e][1],cr?26:12);upd(t)}
async function lunge(u,big){const dy=u.side=='p'?-30:30;await u.el.animate([{transform:'none'},{transform:`translateY(${dy}px) scale(${big?1.2:1.1})`},{transform:'none'}],{duration:380/B.sp,easing:'ease-out'}).finished}
function act(u,ty){const h=u.h;const T=u.side=='p'?(ty=='u'?h.ut:h.st):(u.boss&&ty=='s'?'a':'s'),m=u.side=='p'?(ty=='u'?h.um:h.sm):(ty=='s'?.85:1);return{T,m}}
async function turn(u){const foes=al(u.side=='p'?'e':'p'),fr=al(u.side);u.el.classList.add('act');
 let ty='n';if(u.side=='p'){if(u.q&&u.en>=100)ty='u';else if(u.cd<=0)ty='s'}else if(u.boss&&B.round%3==0)ty='s';
 const{T,m}=ty=='n'?{T:'s',m:1}:act(u,ty);
 if(ty=='u'){u.en=0;u.q=false;await ult(u)}
 if(T=='h'||T=='b'){const ts=T=='b'?fr:(ty=='u'?fr:[fr.reduce((a,b)=>a.hp/a.mh<b.hp/b.mh?a:b)]);
  await lunge(u);ts.forEach(t=>{if(T=='b'){t.au=ty=='u'?3:2;pop(t,'ATK↑','#ffd76a')}else{const v=Math.round(u.atk*m);t.hp=Math.min(t.mh,t.hp+v);pop(t,'+'+v,'#3dff9a')}upd(t);const r=t.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,T=='b'?'#ffd76a':'#3dff9a',14)})}
 else{const ts=T=='a'?foes:[ty=='u'?foes.reduce((a,b)=>a.hp>b.hp?a:b):pick(foes)];await lunge(u,ty=='u');ts.forEach(t=>hitU(u,t,m));if(ty=='u')$('.fld').animate([{transform:'translate(-8px,4px)'},{transform:'translate(8px,-4px)'},{transform:'none'}],{duration:300})}
 if(u.side=='p'){u.en=Math.min(100,u.en+25);if(ty=='s')u.cd=2;else if(ty=='n')u.cd--;}
 if(u.au>0)u.au--;upd(u);u.el.classList.remove('act');await sleep(260/B.sp)}
async function ult(u){snd('ult');const c=$('#cut');c.style.setProperty('--c',EL[u.e][1]);const ci=ASSETS.cutin[u.h.id];c.innerHTML=(ci?`<svg class="ci" viewBox="0 0 16 9" preserveAspectRatio="xMidYMid slice"><image href="${ci}" width="16" height="9"/></svg>`:art(u.h))+`<b class="${ci?'cb':''}"><small>${u.h.n}</small>${u.h.un}</b>`;c.classList.remove('on');void c.offsetWidth;c.classList.add('on');await sleep(950/Math.min(B.sp,2));c.classList.remove('on')}
function end(g){const p=al('p'),e=al('e');if(!e.length){finish(g,true);return true}if(!p.length){finish(g,false);return true}return false}
function finish(g,win,why){if(!B)return;B.on=false;const dead=B.U.filter(u=>u.side=='p'&&!u.alive).length,st=win?(dead==0?3:dead<=2?2:1):0,k=Math.round((200+g*60)*(win?1:.3)),first=win&&g>S.cl,gm=first?60+g*10:0;
 if(win){S.cl=Math.max(S.cl,g);S.stars[g]=Math.max(S.stars[g]||0,st)}S.k+=k;S.g+=gm;save();snd(win?'win':'lose');
 const c=win?'var(--au)':'var(--pk)',o=document.createElement('div');o.className='ov';o.style.cssText='align-items:center;justify-content:center;z-index:90;--c:'+(win?'#ffd76a':'#ff5c9a');
 o.innerHTML=`<div class="res"><h1>${win?'VICTORY':'DEFEAT'}</h1>${win?`<div class="stars">${[1,2,3].map(j=>`<span class="${j<=st?'f':''}">★</span>`).join('')}</div>`:`<p class="dm">${why||'Tim kalah. Naikkan level hero!'}</p>`}<p>Koin <b style="color:var(--au)">+${fmt(k)}</b></p>${gm?`<p>Gems <b style="color:var(--cy)">+${gm}</b></p>`:''}<div class="row"><button class="btn gh" id="b1">KEMBALI</button><button class="btn" id="b2">${win&&g<15?'LANJUT':'ULANGI'}</button></div></div>`;
 $('#st').appendChild(o);if(win)burst(innerWidth/2,innerHeight/3,'#ffd76a',80,9);
 const close=()=>{o.remove();$('#bt').classList.remove('on');B=null;R_[cur]();HUD()};
 o.querySelector('#b1').onclick=()=>{close();go('stage')};o.querySelector('#b2').onclick=()=>{const ng=win&&g<15?g+1:g;close();fight(ng)}}
/* ===== PARTIKEL (canvas) ===== */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
const rs=()=>{const r=$('#st').getBoundingClientRect();cv.width=r.width;cv.height=r.height};rs();addEventListener('resize',rs);
function burst(x,y,col,n=20,v=5){const r=cv.getBoundingClientRect();for(let i=0;i<n;i++){const a=R(0,6.28),s=R(1,v);P.push({x:x-r.left,y:y-r.top,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col,z:R(2,5)})}}
for(let i=0;i<26;i++)P.push({x:R(0,500),y:R(0,900),vx:R(-.2,.2),vy:R(-.5,-.1),l:9,c:'#ffffff',z:R(1,2.5),amb:1});
(function lp(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(p.amb){if(p.y<-5){p.y=cv.height+5;p.x=R(0,cv.width)}cx.globalAlpha=.35}else{p.vy+=.08;p.l-=.025;cx.globalAlpha=Math.max(p.l,0)}cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.z,p.z);return p.amb||p.l>0});cx.globalAlpha=1;requestAnimationFrame(lp)})();
/* ===== EVENT ===== */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.s)go(t.dataset.s);
 else if(t.dataset.id&&t.classList.contains('hc')&&!t.closest('.mini')&&!t.closest('.ov')){snd('tap');heroSheet(t.dataset.id)}
 else if(t.dataset.pre){snd('tap');pre(+t.dataset.pre)}
 else if(t.dataset.ts!=null){snd('tap');teamPick(+t.dataset.ts)}
 else if(t.dataset.pull)pull(+t.dataset.pull);
 else if(t.dataset.gm){S.gm=+t.dataset.gm;snd('tap');R_.gacha()}
 else if(t.dataset.ht){S.ht=+t.dataset.ht;snd('tap');R_.hero()}
 else if(t.dataset.iu&&!t.closest('.ov')&&!t.closest('.mini')){snd('tap');itemSheet(+t.dataset.iu)}
 else if(t.dataset.tc){S.tc=+t.dataset.tc;snd('tap');R_.stage()}
 else if(t.dataset.sp&&B){B.sp=+t.dataset.sp;document.querySelectorAll('.sp[data-sp]').forEach(b=>b.classList.toggle('on',b==t))}
 else if(t.id=='sr'&&B&&B.on){sheet(`<div class="ttl">Menyerah?</div><div class="dm">Pertarungan dihitung kalah.</div><div class="row"><button class="btn gh" id="n_">BATAL</button><button class="btn pk" id="y_">MENYERAH</button></div>`).querySelectorAll('button').forEach(b=>b.onclick=()=>{b.closest('.ov').remove();if(b.id=='y_')finish(B.g,false,'Kamu menyerah.')})}
 else if(t.dataset.u&&B&&B.on){const u=B.U.find(x=>x.side=='p'&&x.i==+t.dataset.u);if(u.alive&&u.en>=100){u.q=!u.q;upd(u);snd('tap')}else if(u.alive)toast('Energi '+u.en+'/100')}});
HUD();go('home');
})();
